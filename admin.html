<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Jakarta Journal</title>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root{--primary-batik:#D4AF37;--jungle-dark:#0D140F;--card-bg:#1A231C;--text-main:#E0E0E0}
        body{font-family:'Pretendard',sans-serif;background-color:var(--jungle-dark);color:var(--text-main);margin:0;padding:20px;}
        .container{max-width:1100px;margin:0 auto}
        header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;border-bottom:1px solid var(--primary-batik);padding-bottom:15px}
        h1{color:var(--primary-batik);margin:0;font-size:1.5rem}
        
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:20px}
        .stat-card{background:var(--card-bg);padding:20px;border-radius:12px;border:1px solid #333;text-align:center;cursor:pointer;transition:0.3s}
        .stat-card:hover{border-color:var(--primary-batik); transform: translateY(-3px);}
        .stat-card i{color:var(--primary-batik);margin-bottom:10px}
        .stat-value{font-size:1.8rem;font-weight:bold;display:block;margin-top:5px}
        .stat-label{font-size:0.8rem;color:#888;text-transform:uppercase}

        /* Chart Section */
        .chart-container { background:var(--card-bg); padding:20px; border-radius:15px; border:1px solid #333; margin-bottom:30px; height: 300px; }

        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:1000;justify-content:center;align-items:center}
        .modal-content{background:var(--card-bg);width:90%;max-width:950px;max-height:85vh;border-radius:15px;border:1px solid var(--primary-batik);padding:30px;overflow:hidden;display:flex;flex-direction:column}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        
        .table-wrapper{overflow-y:auto;flex:1;border-radius:10px;background:#0d140f}
        table{width:100%;border-collapse:collapse;font-size:0.85rem}
        th{position:sticky;top:0;background:#1a231c;padding:12px;text-align:left;color:var(--primary-batik);border-bottom:1px solid #333; z-index: 10;}
        td{padding:12px;border-bottom:1px solid #222;color:#ccc}
        
        .ip-badge{background:#333;padding:2px 6px;border-radius:4px;font-family:monospace;color:var(--primary-batik)}
        .btn-mini{padding:4px 8px; font-size: 0.7rem; cursor:pointer; border-radius:4px; border:1px solid #444; background:none; color:#ccc;}
        .btn-mini.danger:hover{background:#ff4d4d; color:white; border-color:#ff4d4d;}
        .btn-mini.safe:hover{background:var(--primary-batik); color:black; border-color:var(--primary-batik);}

        .admin-grid{display:grid;grid-template-columns: 1.5fr 1fr;gap:20px}
        .admin-section{background:var(--card-bg);padding:25px;border-radius:15px;border:1px solid #333}
        h3{margin-top:0;color:var(--primary-batik);font-size:1rem;margin-bottom:20px;display:flex;align-items:center;gap:10px}
        .btn-action{width:100%;padding:12px;margin-bottom:10px;background:#0d140f;border:1px solid var(--primary-batik);color:var(--primary-batik);cursor:pointer;border-radius:5px;font-weight:bold;display:flex;align-items:center;gap:10px; transition: 0.2s;}
        .btn-action:hover{background:var(--primary-batik);color:#000}
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i data-lucide="shield-check"></i> Admin Dashboard</h1>
        <button onclick="location.href='index.html'" style="background:none; border:1px solid #444; color:#ccc; padding:8px 15px; cursor:pointer; border-radius:5px;">Exit to Site</button>
    </header>

    <div class="stats-grid">
        <div class="stat-card" onclick="showVisitorDetails()">
            <i data-lucide="users"></i>
            <span class="stat-label">Unique Visitors</span>
            <span id="stat-visits" class="stat-value">0</span>
        </div>
        <div class="stat-card" onclick="showPostManager()">
            <i data-lucide="file-text"></i>
            <span class="stat-label">Total Stories</span>
            <span id="stat-posts" class="stat-value">0</span>
        </div>
        <div class="stat-card">
            <i data-lucide="shield-alert"></i>
            <span class="stat-label">Blocked IPs</span>
            <span id="stat-blocked" class="stat-value">0</span>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="visitorChart"></canvas>
    </div>

    <div class="admin-grid">
        <div class="admin-section">
            <h3><i data-lucide="settings"></i> Control Panel</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="btn-action" onclick="location.href='profile.html'"><i data-lucide="user-cog"></i> Admin Profile</button>
                <button class="btn-action" onclick="exportData()"><i data-lucide="download"></i> Backup Data (JSON)</button>
                <button class="btn-action" onclick="showPostManager()"><i data-lucide="library"></i> Manage Stories</button>
                <button class="btn-action" onclick="resetVisitorData()" style="border-color: #ff4d4d; color: #ff4d4d;"><i data-lucide="trash-2"></i> Reset Stats</button>
            </div>
        </div>
        <div class="admin-section">
            <h3><i data-lucide="activity"></i> System Logs</h3>
            <div id="log-container" style="font-size:0.8rem; color:#888; max-height:150px; overflow-y:auto;">
                <div>System initialized...</div>
            </div>
        </div>
    </div>
</div>

<div id="adminModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Details</h3>
            <button class="close-btn" onclick="closeModal()" style="background:none; border:none; color:white; cursor:pointer;"><i data-lucide="x"></i></button>
        </div>
        <div class="table-wrapper">
            <table id="modalTable">
                <thead id="modalThead"></thead>
                <tbody id="modalTbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://jakarta-blog-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    if(sessionStorage.getItem('admin') !== 'true') location.href = 'index.html';

    // 1. 통계 및 차트 로드
    function initDashboard() {
        db.ref('visitorLog').on('value', snap => {
            const logs = snap.val() || {};
            const uniqueIPs = new Set();
            const dateMap = {};

            Object.values(logs).forEach(log => {
                if(log.ip) uniqueIPs.add(log.ip);
                // 차트용 날짜별 집계 (YYYY-MM-DD 형식 가정)
                const date = log.time ? log.time.split('. ')[0] : 'Unknown';
                dateMap[date] = (dateMap[date] || 0) + 1;
            });

            document.getElementById('stat-visits').innerText = uniqueIPs.size;
            updateChart(dateMap);
        });

        db.ref('posts').on('value', snap => {
            document.getElementById('stat-posts').innerText = snap.numChildren() || 0;
        });

        db.ref('blacklist').on('value', snap => {
            document.getElementById('stat-blocked').innerText = snap.numChildren() || 0;
        });
    }

    // 2. 차트 업데이트
    let visitorChart;
    function updateChart(dateData) {
        const ctx = document.getElementById('visitorChart').getContext('2d');
        const labels = Object.keys(dateData).slice(-7);
        const values = Object.values(dateData).slice(-7);

        if(visitorChart) visitorChart.destroy();
        visitorChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Daily Page Views',
                    data: values,
                    borderColor: '#D4AF37',
                    backgroundColor: 'rgba(212, 175, 55, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, grid: { color: '#222' } },
                    x: { grid: { display: false } }
                },
                plugins: { legend: { labels: { color: '#E0E0E0' } } }
            }
        });
    }

    // 3. 방문자 상세 & IP 차단 기능
    async function showVisitorDetails() {
        openModal("Visitor Access Logs");
        const thead = document.getElementById('modalThead');
        const tbody = document.getElementById('modalTbody');
        
        thead.innerHTML = `<tr><th>Last Access</th><th>IP Address</th><th>Location</th><th>Visits</th><th>Action</th></tr>`;
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">Loading...</td></tr>';

        const [logSnap, blockSnap] = await Promise.all([db.ref('visitorLog').once('value'), db.ref('blacklist').once('value')]);
        const logs = logSnap.val() || {};
        const blockedIPs = blockSnap.val() || {};
        
        const grouped = {};
        Object.values(logs).forEach(l => {
            if(!grouped[l.ip]) grouped[l.ip] = {...l, count: 1};
            else { grouped[l.ip].count++; grouped[l.ip].time = l.time; }
        });

        tbody.innerHTML = '';
        Object.values(grouped).sort((a,b) => b.timestamp - a.timestamp).forEach(l => {
            const isBlocked = blockedIPs[l.ip.replace(/\./g, '_')];
            tbody.innerHTML += `
                <tr>
                    <td>${l.time}</td>
                    <td><span class="ip-badge">${l.ip}</span></td>
                    <td>${l.location}</td>
                    <td>${l.count}</td>
                    <td>
                        <button class="btn-mini ${isBlocked?'safe':'danger'}" onclick="toggleBlockIP('${l.ip}')">
                            ${isBlocked ? 'Unblock' : 'Block IP'}
                        </button>
                    </td>
                </tr>`;
        });
    }

    function toggleBlockIP(ip) {
        const key = ip.replace(/\./g, '_');
        db.ref(`blacklist/${key}`).once('value', snap => {
            if(snap.exists()) {
                db.ref(`blacklist/${key}`).remove();
                alert(ip + " has been unblocked.");
            } else {
                db.ref(`blacklist/${key}`).set({ip: ip, date: new Date().toLocaleString()});
                alert(ip + " is now blocked.");
            }
            showVisitorDetails();
        });
    }

    // 4. 게시글 관리 기능
    function showPostManager() {
        openModal("Story Management");
        const thead = document.getElementById('modalThead');
        const tbody = document.getElementById('modalTbody');

        thead.innerHTML = `<tr><th>Title</th><th>Category</th><th>Date</th><th>Action</th></tr>`;
        
        db.ref('posts').once('value', snap => {
            tbody.innerHTML = '';
            snap.forEach(child => {
                const post = child.val();
                tbody.innerHTML += `
                    <tr>
                        <td>${post.title}</td>
                        <td>${post.category || 'General'}</td>
                        <td>${post.date || '-'}</td>
                        <td>
                            <button class="btn-mini danger" onclick="deletePost('${child.key}')">Delete</button>
                        </td>
                    </tr>`;
            });
        });
    }

    function deletePost(key) {
        if(confirm("Permanently delete this story?")) {
            db.ref(`posts/${key}`).remove().then(() => showPostManager());
        }
    }

    // 5. 데이터 백업 (JSON)
    function exportData() {
        db.ref().once('value', snap => {
            const data = JSON.stringify(snap.val(), null, 2);
            const blob = new Blob([data], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `jakarta_journal_backup_${new Date().getTime()}.json`;
            a.click();
        });
    }

    function openModal(title) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('adminModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('adminModal').style.display = 'none'; }
    function resetVisitorData() { if(confirm("Reset all statistics?")) { db.ref('visitorLog').remove(); db.ref('stats/visits').set(0); location.reload(); } }

    initDashboard();
    lucide.createIcons();
</script>

</body>
</html>
