<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Jakarta Journal</title>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root{--primary-batik:#D4AF37;--jungle-dark:#0D140F;--card-bg:#1A231C;--text-main:#E0E0E0}
        body{font-family:'Pretendard',sans-serif;background-color:var(--jungle-dark);color:var(--text-main);margin:0;padding:20px;}
        .container{max-width:1000px;margin:0 auto}
        header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;border-bottom:1px solid var(--primary-batik);padding-bottom:15px}
        h1{color:var(--primary-batik);margin:0;font-size:1.5rem}
        
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:30px}
        .stat-card{background:var(--card-bg);padding:20px;border-radius:12px;border:1px solid #333;text-align:center;cursor:pointer;transition:0.3s}
        .stat-card:hover{border-color:var(--primary-batik); transform: translateY(-5px);}
        .stat-card i{color:var(--primary-batik);margin-bottom:10px}
        .stat-value{font-size:1.8rem;font-weight:bold;display:block;margin-top:5px}
        .stat-label{font-size:0.8rem;color:#888;text-transform:uppercase}

        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:1000;justify-content:center;align-items:center}
        .modal-content{background:var(--card-bg);width:90%;max-width:900px;max-height:80vh;border-radius:15px;border:1px solid var(--primary-batik);padding:30px;overflow:hidden;display:flex;flex-direction:column}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .close-btn{background:none;border:none;color:#fff;cursor:pointer}
        
        .table-wrapper{overflow-y:auto;flex:1;border-radius:10px;background:#0d140f}
        table{width:100%;border-collapse:collapse;font-size:0.85rem}
        th{position:sticky;top:0;background:#1a231c;padding:12px;text-align:left;color:var(--primary-batik);border-bottom:1px solid #333}
        td{padding:12px;border-bottom:1px solid #222;color:#ccc}
        .ip-badge{background:#333;padding:2px 6px;border-radius:4px;font-family:monospace;color:var(--primary-batik)}
        .count-badge{background:var(--primary-batik);color:#000;padding:2px 8px;border-radius:10px;font-weight:bold;font-size:0.75rem}

        .admin-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px}
        .admin-section{background:var(--card-bg);padding:25px;border-radius:15px;border:1px solid #333}
        h3{margin-top:0;color:var(--primary-batik);font-size:1rem;margin-bottom:20px;display:flex;align-items:center;gap:10px}
        .btn-action{width:100%;padding:12px;margin-bottom:10px;background:#0d140f;border:1px solid var(--primary-batik);color:var(--primary-batik);cursor:pointer;border-radius:5px;font-weight:bold;text-align:left;display:flex;align-items:center;gap:10px}
        .btn-action:hover{background:var(--primary-batik);color:#000}
        .log-list{font-size:0.85rem;color:#ccc;max-height:200px;overflow-y:auto;padding:0;list-style:none}
        .log-item{padding:8px 0;border-bottom:1px solid #222;display:flex;justify-content:space-between}
        .log-time{color:#666;font-size:0.75rem}
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i data-lucide="shield-check"></i> Admin Dashboard</h1>
        <button onclick="location.href='index.html'" style="background:none; border:1px solid #444; color:#ccc; padding:8px 15px; cursor:pointer; border-radius:5px;">Exit</button>
    </header>

    <div class="stats-grid">
        <div class="stat-card" onclick="showVisitorDetails()">
            <i data-lucide="users"></i>
            <span class="stat-label">Unique Visitors</span>
            <span id="stat-visits" class="stat-value">0</span>
        </div>
        <div class="stat-card">
            <i data-lucide="file-text"></i>
            <span class="stat-label">Stories</span>
            <span id="stat-posts" class="stat-value">0</span>
        </div>
        <div class="stat-card">
            <i data-lucide="message-square"></i>
            <span class="stat-label">Comments</span>
            <span id="stat-comments" class="stat-value">0</span>
        </div>
    </div>

    <div class="admin-grid">
        <div class="admin-section">
            <h3><i data-lucide="settings"></i> Management</h3>
            <button class="btn-action" onclick="location.href='profile.html'"><i data-lucide="user-cog"></i> Edit Admin Profile</button>
            <button class="btn-action" onclick="resetVisitorData()"><i data-lucide="rotate-ccw"></i> Reset All Visitor Data</button>
            <button class="btn-action" onclick="exportData()"><i data-lucide="download"></i> Backup Database</button>
        </div>
        <div class="admin-section">
            <h3><i data-lucide="activity"></i> System Logs</h3>
            <ul class="log-list" id="log-container"></ul>
        </div>
    </div>
</div>

<div id="visitorModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i data-lucide="list"></i> Unique Visitor Access Logs</h3>
            <button class="close-btn" onclick="closeModal()"><i data-lucide="x"></i></button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Last Access</th>
                        <th>IP Address</th>
                        <th>Device Info</th>
                        <th>Location</th>
                        <th style="text-align:center">Visits</th>
                    </tr>
                </thead>
                <tbody id="visitor-table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://jakarta-blog-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    if(sessionStorage.getItem('admin') !== 'true') location.href = 'index.html';

    function loadStats() {
        // 메인 카드의 Total Visits를 고유 IP 수 기반으로 표시하도록 수정
        db.ref('visitorLog').on('value', snap => {
            if(!snap.exists()) {
                document.getElementById('stat-visits').innerText = 0;
                return;
            }
            const data = snap.val();
            const uniqueIPs = new Set();
            Object.values(data).forEach(log => {
                if(log.ip) uniqueIPs.add(log.ip);
            });
            document.getElementById('stat-visits').innerText = uniqueIPs.size;
        });

        db.ref('posts').on('value', snap => {
            document.getElementById('stat-posts').innerText = snap.numChildren() || 0;
        });
    }

    function showVisitorDetails() {
        const modal = document.getElementById('visitorModal');
        const tbody = document.getElementById('visitor-table-body');
        modal.style.display = 'flex';
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">Processing unique visitor data...</td></tr>';

        db.ref('visitorLog').once('value', snap => {
            tbody.innerHTML = '';
            if(!snap.exists()) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">No logs found.</td></tr>';
                return;
            }

            const rawLogs = snap.val();
            const groupedLogs = {};

            // IP별 그룹화 및 카운트
            Object.values(rawLogs).forEach(log => {
                const ip = log.ip || 'Unknown';
                if (!groupedLogs[ip]) {
                    groupedLogs[ip] = {
                        ...log,
                        count: 1,
                        timestamp: log.timestamp || 0
                    };
                } else {
                    groupedLogs[ip].count += 1;
                    // 가장 최근 시간으로 업데이트
                    if ((log.timestamp || 0) > groupedLogs[ip].timestamp) {
                        groupedLogs[ip].time = log.time;
                        groupedLogs[ip].timestamp = log.timestamp;
                    }
                }
            });

            // 최신 방문 순으로 정렬
            const sortedLogs = Object.values(groupedLogs).sort((a, b) => b.timestamp - a.timestamp);

            sortedLogs.forEach(log => {
                const row = `
                    <tr>
                        <td>${log.time || '-'}</td>
                        <td><span class="ip-badge">${log.ip}</span></td>
                        <td style="font-size:0.75rem; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${log.agent}">${log.agent || '-'}</td>
                        <td>${log.location || 'Unknown'}</td>
                        <td style="text-align:center"><span class="count-badge">${log.count}</span></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        });
    }

    function closeModal() { document.getElementById('visitorModal').style.display = 'none'; }

    function resetVisitorData() {
        if(confirm("Are you sure? This will delete ALL visitor history.")) {
            db.ref('stats/visits').set(0);
            db.ref('visitorLog').remove();
            location.reload();
        }
    }

    window.onclick = function(event) {
        if (event.target == document.getElementById('visitorModal')) closeModal();
    }

    loadStats();
    lucide.createIcons();
</script>

</body>
</html>
