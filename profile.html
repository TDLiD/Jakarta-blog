<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile | Jakarta Journal</title>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root{--primary-batik:#D4AF37;--jungle-dark:#0D140F;--card-bg:#1A231C;--text-main:#E0E0E0}
        body{font-family:'Pretendard',sans-serif;background-color:var(--jungle-dark);color:var(--text-main);display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0; padding: 20px 0;}
        .profile-card{background:var(--card-bg);padding:40px;border-radius:15px;width:100%;max-width:420px;border:1px solid var(--primary-batik);box-shadow:0 10px 30px rgba(0,0,0,0.5)}
        h2{color:var(--primary-batik);margin-top:0;text-align:center;font-weight: 700; margin-bottom: 25px;}
        h3 { color:var(--primary-batik); font-size: 0.8rem; margin: 18px 0 5px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .pw-wrapper { position: relative; width: 100%; }
        input,textarea{width:100%;padding:11px;margin:6px 0;background:#0d140f;border:1px solid #333;color:#fff;border-radius:5px;box-sizing:border-box; font-size: 0.85rem;}
        input:focus{outline: none; border-color: var(--primary-batik);}
        .eye-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #666; z-index: 10; }
        .btn-save{width:100%;background:var(--primary-batik);border:none;padding:14px;border-radius:5px;font-weight:bold;cursor:pointer;margin-top:20px; color: #000; font-size: 1rem; transition: 0.3s;}
        .btn-save:hover { background: #f1d279; }
        .btn-back{width:100%;background:none;border:none;color:#666;margin-top:12px;cursor:pointer; font-size: 0.8rem; width: 100%;}
        .preview-img{width:80px;height:80px;border-radius:50%;display:block;margin:0 auto 10px;border:2px solid var(--primary-batik);object-fit:cover}
    </style>
</head>
<body>
    <div class="profile-card">
        <h2>Admin Settings</h2>
        <img id="currentImg" class="preview-img" src="https://picsum.photos/200">
        
        <h3>Basic Account</h3>
        <input type="text" id="adminId" placeholder="Admin Login ID" autocomplete="one-time-code">
        <input type="email" id="adminEmail" placeholder="Email Address" autocomplete="one-time-code">

        <h3>Public Profile</h3>
        <input type="text" id="adminName" placeholder="Display Name">
        <input type="text" id="adminPhoto" placeholder="Profile Image URL" onchange="document.getElementById('currentImg').src=this.value">
        <textarea id="adminBio" rows="3" placeholder="Biography..."></textarea>

        <h3>Security (Change Password)</h3>
        <div class="pw-wrapper">
            <input type="password" id="currentPw" placeholder="Current Password" autocomplete="new-password">
            <i data-lucide="eye" class="eye-btn" onclick="togglePw('currentPw', this)"></i>
        </div>
        <div class="pw-wrapper">
            <input type="password" id="newPw" placeholder="New Password" autocomplete="new-password">
            <i data-lucide="eye" class="eye-btn" onclick="togglePw('newPw', this)"></i>
        </div>
        <div class="pw-wrapper">
            <input type="password" id="confirmPw" placeholder="Confirm New Password" autocomplete="new-password" onkeydown="if(event.key==='Enter') saveProfile()">
            <i data-lucide="eye" class="eye-btn" onclick="togglePw('confirmPw', this)"></i>
        </div>
        
        <button class="btn-save" onclick="saveProfile()">SAVE CHANGES</button>
        <button class="btn-back" onclick="location.href='admin.html'">Cancel and Exit</button>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://jakarta-blog-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let cachedAdminData = null;

        if(sessionStorage.getItem('admin') !== 'true') location.href = 'index.html';

        // 데이터를 불러와서 input에 채우기
        function loadData() {
            db.ref('adminInfo').once('value', (snap) => {
                const data = snap.val();
                if(data) {
                    cachedAdminData = data;
                    document.getElementById('adminId').value = data.id || '';
                    document.getElementById('adminEmail').value = data.email || '';
                    document.getElementById('adminName').value = data.name || '';
                    document.getElementById('adminPhoto').value = data.photo || '';
                    document.getElementById('adminBio').value = data.bio || '';
                    if(data.photo) document.getElementById('currentImg').src = data.photo;
                    
                    // 핵심: 보안을 위해 비밀번호 입력 칸은 항상 비워둡니다.
                    document.getElementById('currentPw').value = "";
                    document.getElementById('newPw').value = "";
                    document.getElementById('confirmPw').value = "";
                }
            });
        }
        loadData();

        function togglePw(inputId, icon) {
            const target = document.getElementById(inputId);
            target.type = (target.type === 'password') ? 'text' : 'password';
            icon.setAttribute('data-lucide', target.type === 'password' ? 'eye' : 'eye-off');
            lucide.createIcons();
        }

        async function saveProfile() {
            const currentPwInput = document.getElementById('currentPw').value;
            const newPwInput = document.getElementById('newPw').value;
            const confirmPwInput = document.getElementById('confirmPw').value;

            // 1. 기본 정보 수집
            let updateData = { 
                ...cachedAdminData,
                id: document.getElementById('adminId').value,
                email: document.getElementById('adminEmail').value,
                name: document.getElementById('adminName').value,
                photo: document.getElementById('adminPhoto').value,
                bio: document.getElementById('adminBio').value
            };

            // 2. 비밀번호 변경 로직 (중복 체크 추가)
            // 하나라도 입력했을 경우에만 비번 변경 프로세스 작동
            if (currentPwInput || newPwInput || confirmPwInput) {
                // 현재 비번이 맞는지 확인
                if (currentPwInput !== cachedAdminData.password) {
                    alert('Current password incorrect.');
                    return;
                }
                // 새 비번과 확인 비번이 일치하는지 확인 (중복체크)
                if (newPwInput !== confirmPwInput) {
                    alert('New password and Confirmation do not match.');
                    return;
                }
                // 새 비번이 입력되었는지 확인
                if (!newPwInput) {
                    alert('Please enter a new password.');
                    return;
                }
                // 비번 업데이트
                updateData.password = newPwInput;
            }

            try {
                await db.ref('adminInfo').set(updateData);
                alert('Profile updated successfully!');
                
                // 저장 성공 후 세션 정보 등을 고려해 메인으로 이동
                window.location.replace('admin.html');
            } catch (err) {
                alert('Save failed: ' + err.message);
            }
        }
        lucide.createIcons();
    </script>
</body>
</html>
