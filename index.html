<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jakarta Journal | Admin Portal</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --primary-batik: #D4AF37;
            --accent-gold: #FFD700;
            --jungle-dark: #0D140F;
            --card-bg: #1A231C;
            --text-main: #E0E0E0;
            --text-muted: #A0A0A0;
            --white: #ffffff;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--jungle-dark);
            color: var(--text-main);
            margin: 0;
            line-height: 1.6;
        }
        .hero {
            position: relative;
            height: 50vh;
            min-height: 400px;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('images/bg/bg1.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--white);
        }
        .hero-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            margin-bottom: 1rem;
        }
        .hero-badge {
            background: var(--primary-batik);
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            display: inline-block;
            color: var(--jungle-dark);
        }
        .navbar {
            background: rgba(13, 20, 15, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--primary-batik);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .nav-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-batik);
            text-decoration: none;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 40px;
            padding: 60px 0;
        }
        .post-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
            margin-bottom: 30px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            position: relative;
        }
        .post-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-batik);
        }
        .post-image {
            height: 250px;
            background-color: #222;
            background-size: cover;
            background-position: center;
        }
        .post-info {
            padding: 1.5rem;
        }
        .admin-only {
            display: none;
        }
        .sidebar-card {
            background: linear-gradient(135deg, #1B3022, #0D140F);
            color: var(--white);
            padding: 2rem;
            border-radius: 15px;
            border: 1px solid var(--primary-batik);
            margin-bottom: 20px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--primary-batik);
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0d140f;
            border: 1px solid #333;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-gold {
            background: var(--primary-batik);
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            color: var(--jungle-dark);
            font-weight: bold;
        }
        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--primary-batik);
            cursor: pointer;
            object-fit: cover;
            display: none;
        }
        @media (max-width: 968px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-flex">
            <a href="/" class="logo">JAKARTA JOURNAL</a>
            <div style="display:flex; gap:15px; align-items:center;">
                <button id="loginBtn" onclick="openLogin()" style="background:none; border:none; color:var(--primary-batik);"><i data-lucide="user-lock"></i></button>
                <img id="profileBtn" class="profile-img" src="https://picsum.photos/40" onclick="location.href='profile.html'" title="Admin Settings">
                <button id="logoutBtn" onclick="logout()" style="display:none; background:none; border:none; color:var(--primary-batik); font-weight:bold; font-size:12px;">LOGOUT</button>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <span class="hero-badge">The Heart of Indonesia</span>
            <h1>Wonderful Jakarta</h1>
            <p style="opacity:0.9;">Exploring the vibrant fusion of tradition and modernity.</p>
        </div>
    </header>

    <main class="container">
        <div class="main-layout">
            <div class="content-area" id="postContainer"></div>
            <aside class="sidebar">
                <div class="admin-only" id="adminPanel">
                    <button class="btn-gold" style="width:100%; margin-bottom:20px;" onclick="openPostModal()">+ NEW POST</button>
                </div>
                <section class="sidebar-card">
                    <h3 style="font-family:'Playfair Display',serif; color:var(--primary-batik);">About Journal</h3>
                    <p id="aboutText" style="font-size:0.9rem; opacity:0.8;">Curating the best travel experiences across Jakarta.</p>
                </section>
            </aside>
        </div>
    </main>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2 style="color:var(--primary-batik); margin-top:0;">Admin Login</h2>
            <input type="text" id="adminId" placeholder="ID">
            <input type="password" id="adminPw" placeholder="Password">
            <button class="btn-gold" style="width:100%; margin-top:10px;" onclick="handleLogin()">LOGIN</button>
            <button onclick="closeModal('loginModal')" style="background:none; border:none; color:var(--text-muted); width:100%; margin-top:10px;">Cancel</button>
        </div>
    </div>

    <div id="postModal" class="modal">
        <div class="modal-content">
            <h2 style="color:var(--primary-batik); margin-top:0;">Create Post</h2>
            <input type="text" id="postTitle" placeholder="Post Title">
            <input type="text" id="postCat" placeholder="Category">
            <input type="text" id="postImg" placeholder="Image URL">
            <textarea id="postDesc" rows="4" placeholder="Description"></textarea>
            <button class="btn-gold" style="width:100%;" onclick="savePost()">SAVE POST</button>
            <button onclick="closeModal('postModal')" style="background:none; border:none; color:var(--text-muted); width:100%; margin-top:10px;">Cancel</button>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = { databaseURL: "https://jakarta-blog-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // UI Helpers
        function openLogin(){ document.getElementById('loginModal').style.display='flex'; }
        function closeModal(id){ document.getElementById(id).style.display='none'; }
        function openPostModal(){ document.getElementById('postModal').style.display='flex'; }

        // [수정] DB의 adminInfo를 참조하여 로그인 처리
        function handleLogin() {
            const inputId = document.getElementById('adminId').value;
            const inputPw = document.getElementById('adminPw').value;

            // DB에서 관리자 정보 조회
            db.ref('adminInfo').once('value', (snap) => {
                const admin = snap.val();
                
                if (admin && inputId === admin.id && inputPw === admin.password) {
                    sessionStorage.setItem('admin', 'true');
                    updateUI();
                    closeModal('loginModal');
                    alert('반갑습니다, 관리자님!');
                } else {
                    alert('ID 또는 비밀번호가 일치하지 않습니다.');
                }
            });
        }

        function logout() {
            sessionStorage.removeItem('admin');
            location.reload();
        }

        function updateUI() {
            const loggedIn = sessionStorage.getItem('admin') === 'true';
            document.getElementById('adminPanel').style.display = loggedIn ? 'block' : 'none';
            document.getElementById('loginBtn').style.display = loggedIn ? 'none' : 'block';
            document.getElementById('profileBtn').style.display = loggedIn ? 'block' : 'none';
            document.getElementById('logoutBtn').style.display = loggedIn ? 'block' : 'none';
            
            // 실시간 DB 연동: 프로필 이미지 및 소개글 업데이트
            db.ref('adminInfo').on('value', (snap) => {
                const info = snap.val();
                if(info) {
                    // via.placeholder.com 오류를 방지하기 위해 picsum 사용 또는 기본값 설정
                    const profileBtn = document.getElementById('profileBtn');
                    profileBtn.src = info.photo || 'https://picsum.photos/40';
                    
                    if(info.name) {
                        document.getElementById('aboutText').innerHTML = `Managed by <b>${info.name}</b>. ${info.bio || ''}`;
                    }
                }
            });
        }

        function savePost() {
            const data = {
                title: document.getElementById('postTitle').value,
                cat: document.getElementById('postCat').value,
                img: document.getElementById('postImg').value || 'https://picsum.photos/800/500',
                desc: document.getElementById('postDesc').value,
                date: new Date().toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})
            };
            db.ref('posts').push(data).then(() => {
                closeModal('postModal');
                alert('포스트가 저장되었습니다.');
            });
        }

        function loadPosts() {
            db.ref('posts').on('value', (snap) => {
                const posts = snap.val();
                let html = '<h2 style="font-family:\'Playfair Display\',serif; margin-bottom:2rem; color:var(--primary-batik);">Latest Stories</h2>';
                if(posts) {
                    Object.keys(posts).reverse().forEach(key => {
                        const p = posts[key];
                        html += `
                            <article class="post-card">
                                <div class="post-image" style="background-image:url('${p.img}')"></div>
                                <div class="post-info">
                                    <span style="background:var(--primary-batik); color:var(--jungle-dark); padding:2px 8px; font-size:11px; font-weight:bold; border-radius:3px;">${p.cat}</span>
                                    <h3 style="font-size:1.5rem; margin:0.5rem 0; font-family:'Playfair Display',serif;">${p.title}</h3>
                                    <p style="color:var(--text-muted); font-size:0.95rem;">${p.desc}</p>
                                    <small style="color:var(--primary-batik); opacity:0.7;">${p.date}</small>
                                </div>
                            </article>`;
                    });
                } else {
                    html += '<p style="color:var(--text-muted);">작성된 게시글이 없습니다.</p>';
                }
                document.getElementById('postContainer').innerHTML = html;
            });
        }

        window.onload = () => { 
            loadPosts(); 
            updateUI(); 
            lucide.createIcons(); 
        };
    </script>
</body>
</html>
