<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jakarta Journal | Discover Indonesia</title>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-flex">
            <a href="/" class="logo">JAKARTA JOURNAL</a>
            <div class="nav-right">
                <button id="loginBtn" onclick="openLogin()" class="icon-btn"><i data-lucide="user-lock"></i></button>
                <div id="adminControls" style="display:none; align-items:center; gap:15px;">
                    <button class="btn-create" onclick="openPostModal()"><i data-lucide="plus-circle"></i> NEW</button>
                    <img id="profileBtn" class="profile-img" src="images/profile/6.gif" onclick="openProfileModal()">
                    <button id="logoutBtn" onclick="logout()" class="logout-link">LOGOUT</button>
                </div>
            </div>
        </div>
    </nav>

    <header class="hero" id="mainHero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <span class="hero-badge">THE SOUL OF JAVA</span>
            <h1 class="hero-title">Wonderful Jakarta</h1>
            <p class="hero-subtitle">Exploring the vibrant fusion of heritage and high-rise.</p>
            <div class="hero-scroll">
                <div class="mouse"></div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="main-layout">
            <section class="content-area" id="postContainer">
                </section>
            
            <aside class="sidebar">
                <div class="sidebar-card about-card">
                    <h3>The Journal</h3>
                    <p id="aboutText">Curating the best travel experiences across Jakarta.</p>
                </div>
                </aside>
        </div>
    </main>

    <div id="loginModal" class="modal">
        <div class="modal-content glass">
            <h2>Admin Gateway</h2>
            <div class="input-group">
                <input type="text" id="adminId" placeholder="Access ID">
                <input type="password" id="adminPw" placeholder="Security Key">
            </div>
            <button class="btn-gold-full" onclick="handleLogin()">AUTHENTICATE</button>
            <button class="btn-text" onclick="closeModal('loginModal')">Cancel</button>
        </div>
    </div>

    <div id="postModal" class="modal">
        <div class="modal-content glass">
            <h2>New Story</h2>
            <input type="text" id="postTitle" placeholder="Enter Title">
            <input type="text" id="postCat" placeholder="Category (e.g. Travel, Food)">
            <input type="text" id="postImg" placeholder="Image URL Path">
            <textarea id="postDesc" rows="6" placeholder="Share your experience..."></textarea>
            <button class="btn-gold-full" onclick="savePost()">PUBLISH STORY</button>
            <button class="btn-text" onclick="closeModal('postModal')">Cancel</button>
        </div>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content glass center">
            <h2>Identity Image</h2>
            <div id="profileGrid" class="profile-grid"></div>
            <button class="btn-text" onclick="closeModal('profileModal')">Close</button>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
