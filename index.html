<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jakarta Journal | Discover Indonesia</title>
    
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-flex">
            <a href="javascript:void(0)" onclick="loadPosts()" class="logo">JAKARTA JOURNAL</a>
            
            <div class="nav-right">
                <button id="loginBtn" onclick="openLogin()" class="icon-btn" title="Admin Login">
                    <i data-lucide="user-lock"></i>
                </button>

                <div id="adminControls" style="display:none; align-items:center; gap:15px;">
                    <button class="nav-admin-btn create" onclick="openPostModal()">
                        <i data-lucide="plus-circle" size="18"></i>
                        <span>NEW STORY</span>
                    </button>
                    
                    <div class="profile-area" style="display: flex; align-items: center; gap: 10px; padding: 0 5px; border-left: 1px solid #333; border-right: 1px solid #333;">
                        <button id="adminDashBtn" class="icon-btn dashboard-link" onclick="location.href='admin.html'" title="Admin Dashboard">
                            <i data-lucide="layout-dashboard"></i>
                        </button>
                        
                        <div class="profile-wrapper" style="position: relative; line-height: 0;">
                            <img id="profileBtn" class="profile-img" 
                                 src="./images/profile/6.gif" 
                                 onerror="this.src='https://picsum.photos/100'" 
                                 onclick="location.href='profile.html'" 
                                 style="cursor: pointer; width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--primary-batik);">
                            <span class="status-dot"></span>
                        </div>
                    </div>

                    <button id="logoutBtn" onclick="logout()" class="nav-admin-btn logout">
                        <i data-lucide="log-out" size="18"></i>
                        <span>LOGOUT</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <header class="hero" id="mainHero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <span class="hero-badge">THE SOUL OF JAVA</span>
            <h1 class="hero-title">Wonderful Jakarta</h1>
            <p class="hero-subtitle">Exploring the vibrant fusion of heritage and high-rise.</p>
            <div class="hero-scroll">
                <div class="mouse"></div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="main-layout">
            <section class="content-area" id="postContainer">
                </section>
            
            <aside class="sidebar">
                <div class="sidebar-card about-card">
                    <h3>The Journal</h3>
                    <p id="aboutText">Curating the best travel experiences across Jakarta.</p>
                </div>
            </aside>
        </div>
    </main>

    <div id="loginModal" class="modal">
        <div class="modal-content glass">
            <h2>Admin Gateway</h2>
            <div class="input-group">
                <input type="text" id="adminId" placeholder="Access ID" onkeydown="if(event.key==='Enter') handleLogin()">
                <input type="password" id="adminPw" placeholder="Security Key" onkeydown="if(event.key==='Enter') handleLogin()">
            </div>
            
            <div style="text-align: right; margin-bottom: 10px;">
                <button type="button" onclick="forgotPassword()" style="background:none; border:none; color:var(--primary-batik); font-size:0.75rem; cursor:pointer; text-decoration: underline;">
                    Forgot Password?
                </button>
            </div>

            <button class="btn-gold-full" onclick="handleLogin()">AUTHENTICATE</button>
            <button class="btn-text" onclick="closeModal('loginModal')">Cancel</button>
        </div>
    </div>

    <div id="postModal" class="modal">
        <div class="modal-content glass">
            <h2>New Story</h2>
            <input type="text" id="postTitle" placeholder="Enter Title">
            <input type="text" id="postCat" placeholder="Category (e.g. Travel, Food)">
            <input type="text" id="postImg" placeholder="Image URL Path">
            <textarea id="postDesc" rows="6" placeholder="Share your experience..."></textarea>
            <button class="btn-gold-full" onclick="savePost()">PUBLISH STORY</button>
            <button class="btn-text" onclick="closeModal('postModal')">Cancel</button>
        </div>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content glass center">
            <h2>Identity Image</h2>
            <div id="profileGrid" class="profile-grid"></div>
            <button class="btn-text" onclick="closeModal('profileModal')">Close</button>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script>
        // Lucide 아이콘 초기화
        lucide.createIcons();

// 페이지 로드 시 관리자 권한 체크 및 UI 동기화
function checkAuth() {
    const isAdmin = sessionStorage.getItem('admin') === 'true';
    const adminControls = document.getElementById('adminControls');
    const loginBtn = document.getElementById('loginBtn');

    if (isAdmin) {
        if (adminControls) adminControls.style.display = 'flex';
        if (loginBtn) loginBtn.style.display = 'none';
    } else {
        if (adminControls) adminControls.style.display = 'none';
        if (loginBtn) loginBtn.style.display = 'block';
    }
}

// 초기 실행
document.addEventListener('DOMContentLoaded', checkAuth);

    </script>
</body>
</html>
