<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jakarta Journal | Discover Indonesia</title>
    
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* AI 팝업 전용 추가 스타일 */
        #aiWelcomeModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .ai-glass-card {
            background: #121212;
            border: 1px solid #d4af37;
            width: 100%;
            max-width: 500px;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #aiWelcomeContent {
            color: #efefef;
            line-height: 1.8;
            font-size: 16px;
            word-break: keep-all;
            white-space: pre-wrap; 
        }
        .typing-cursor::after {
            content: '|';
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
#scrollToTopBtn:hover {
    transform: translateY(-5px);
    background: #fff !important;
    color: #000 !important;
}
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-flex">
            <a href="javascript:void(0)" onclick="loadPosts()" class="logo">JAKARTA JOURNAL</a>
            <div class="nav-right">
                <button id="loginBtn" onclick="openLogin()" class="icon-btn" title="Admin Login">
                    <i data-lucide="user-lock"></i>
                </button>
                <div id="adminControls" style="display:none; align-items:center; gap:15px;">
                    <button class="nav-admin-btn create" onclick="openPostModal()">
                        <i data-lucide="plus-circle" size="18"></i>
                        <span>NEW STORY</span>
                    </button>
                    <div class="profile-area" style="display: flex; align-items: center; gap: 10px; padding: 0 5px; border-left: 1px solid #333; border-right: 1px solid #333;">
                        <button id="adminDashBtn" class="icon-btn dashboard-link" onclick="location.href='admin.html'" title="Admin Dashboard">
                            <i data-lucide="layout-dashboard"></i>
                        </button>
                        <div class="profile-wrapper" style="position: relative; line-height: 0;">
                            <img id="profileBtn" class="profile-img" src="./images/profile/6.gif" onerror="this.src='https://picsum.photos/100'" onclick="location.href='profile.html'" style="cursor: pointer; width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--primary-batik);">
                            <span class="status-dot"></span>
                        </div>
                    </div>
                    <button id="logoutBtn" onclick="logout()" class="nav-admin-btn logout">
                        <i data-lucide="log-out" size="18"></i>
                        <span>LOGOUT</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <header class="hero" id="mainHero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <span class="hero-badge">THE SOUL OF JAVA</span>
            <h1 class="hero-title">Wonderful Jakarta</h1>
            <p class="hero-subtitle">Exploring the vibrant fusion of heritage and high-rise.</p>
            <div class="hero-scroll"><div class="mouse"></div></div>
        </div>
    </header>

    <main class="container">
        <div class="main-layout">
            <section class="content-area" id="postContainer"></section>
            <aside class="sidebar">
                <div class="sidebar-card about-card">
                    <h3>The Journal</h3>
                    <p id="aboutText">Curating the best travel experiences across Jakarta.</p>
                </div>
            </aside>
        </div>
    </main>

    <div id="aiWelcomeModal">
        <div class="ai-glass-card">
            <div style="padding:40px;">
                <div style="display:flex; align-items:center; gap:20px; margin-bottom:25px;">
                    <div style="width:60px; height:60px; background:linear-gradient(135deg, #d4af37, #b8860b); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:30px; box-shadow:0 10px 20px rgba(212,175,55,0.2);">🤖</div>
                    <div>
                        <h4 style="color:#d4af37; margin:0; font-size:11px; letter-spacing:3px; font-weight:900; text-transform:uppercase;">AI Concierge</h4>
                        <p style="color:white; margin:0; font-size:20px; font-weight:700;">Welcome, Explorer!</p>
                    </div>
                </div>
                <div style="background:rgba(255,255,255,0.03); border:1px solid rgba(212,175,55,0.1); border-radius:20px; padding:25px; min-height:120px; margin-bottom:30px;">
                    <div id="aiWelcomeContent">Analyzing...</div>
                </div>
                <button onclick="closeAiWelcome()" style="width:100%; background:#d4af37; color:black; border:none; padding:18px; border-radius:15px; font-weight:900; cursor:pointer; transition:all 0.3s; letter-spacing:1px;" onmouseover="this.style.transform='scale(1.02)'; this.style.background='#f1c40f';" onmouseout="this.style.transform='scale(1)'; this.style.background='#d4af37';">
                    START READING
                </button>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script>
        lucide.createIcons();

        function checkAuth() {
            const isAdmin = sessionStorage.getItem('admin') === 'true';
            const adminControls = document.getElementById('adminControls');
            const loginBtn = document.getElementById('loginBtn');
            if (isAdmin) {
                if (adminControls) adminControls.style.display = 'flex';
                if (loginBtn) loginBtn.style.display = 'none';
            } else {
                if (adminControls) adminControls.style.display = 'none';
                if (loginBtn) loginBtn.style.display = 'block';
            }
        }

        // --- AI Welcome Logic (Corrected Version) ---
        async function startWelcomeAI() {
            const modal = document.getElementById('aiWelcomeModal');
            const content = document.getElementById('aiWelcomeContent');
            const welcomeTitle = document.querySelector('#aiWelcomeModal p'); 
            
            modal.style.display = 'flex';

            try {
                // 1. 접속 국가 정보 가져오기
                let countryName = "Earth"; 
                try {
                    const geoRes = await fetch("https://ipapi.co/json/");
                    const geoData = await geoRes.json();
                    if(geoData.country_name) {
                        countryName = geoData.country_name;
                        if(welcomeTitle) welcomeTitle.innerText = `Welcome! You're visiting from ${countryName}`;
                    }
                } catch(geoErr) {
                    console.error("Geo-IP detection failed:", geoErr);
                }

                // 2. Firebase에서 API KEY 가져오기
                const snapshot = await firebase.database().ref('adminInfo').once('value');
                const adminData = snapshot.val();
                
                if (!adminData || !adminData.LLMAPIkey) {
                    throw new Error("API Key not found in Firebase");
                }
                
                const GROQ_KEY = adminData.LLMAPIkey;

                // 3. 시간 데이터 준비
                const now = new Date();
                const jktTime = new Intl.DateTimeFormat('en-US', {
                    timeZone: 'Asia/Jakarta',
                    hour: '2-digit', minute: '2-digit', hour12: true, weekday: 'long'
                }).format(now);
                
                const seoTime = new Intl.DateTimeFormat('en-US', {
                    timeZone: 'Asia/Seoul',
                    hour: '2-digit', minute: '2-digit', hour12: true
                }).format(now);

                // 4. Groq AI API 호출
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_KEY}`,
                        "Content-Type": "application/json"
                    },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [{
                    role: "system",
                    content: `You are the professional AI Guide for 'Jakarta Journal'. 
                    Respond ONLY in English. Use professional yet friendly tone with appropriate emojis. 
                    Use clear line breaks between different sections.`
                }, {
                    role: "user",
                    content: `The visitor is connecting from ${countryName}. 
                    Create a brief welcome briefing with the following data:
                    
                    - Context: Jakarta is ${jktTime}, Seoul is ${seoTime}.
                    - Weather: Mention Jakarta is tropical/warm while Seoul is in its seasonal phase.
                    - Economy: One line about Indonesia and South Korea's economic situation.
                    - Luck: Random 2-digit lucky number and a color.
                    - Humor: A short, witty joke about coffee in Indonesia.
                    
                    Structure:
                    1. Greeting (Mention their country: ${countryName})
                    2. Economic Insight.
                    3. Daily Luck.
                    4. A quick Joke.
                    
                    Keep it under 150 words.`
                }],
                temperature: 0.7,
                max_tokens: 500
            })
        });

                const data = await response.json();
                const text = data.choices[0].message.content || "Welcome to Jakarta Journal!";
                
                // 타이핑 효과 실행
                typeWriter(text, content);

            } catch (e) {
                console.error("AI Briefing Error:", e);
                content.innerHTML = "Welcome to Jakarta Journal!\n\nExplore our stories of heritage and high-rises. 🌴";
            }
        }

        function typeWriter(text, element) {
            let i = 0;
            element.innerText = ""; 
            element.classList.add('typing-cursor');
            
            function step() {
                if (i < text.length) {
                    element.innerText += text.charAt(i);
                    i++;
                    setTimeout(step, 20);
                } else {
                    element.classList.remove('typing-cursor');
                }
            }
            step();
        }

        function closeAiWelcome() {
            document.getElementById('aiWelcomeModal').style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            setTimeout(startWelcomeAI, 1200);
        });
    </script>
</body>
</html>
